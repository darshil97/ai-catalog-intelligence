# Tunables live here. Secrets stay in .env, referenced as ${VAR} or ${VAR:-default}.

app:
  environment: ${APP_ENV:-local}
  # Render sets RENDER_GIT_COMMIT on each deploy.
  code_sha: ${RENDER_GIT_COMMIT:-unknown}

logging:
  level: ${LOG_LEVEL:-INFO}

api:
  host: ${API_HOST:-127.0.0.1}
  port: ${PORT:-8000}
  # Comma-separated browser origins allowed to call the API.
  cors_origins: ${CORS_ORIGINS:-http://localhost:3000}
  cors_max_age_seconds: 600

database:
  # Pooled endpoint for runtime, direct endpoint for migrations.
  url: ${DATABASE_URL:-}
  direct_url: ${DATABASE_URL_DIRECT:-}
  connect_timeout_seconds: 15
  pool_min_size: 0
  pool_max_size: 3
  # Idle connections close quickly, so they can't keep Neon awake.
  pool_max_idle_seconds: 60

# Emergency stop: no new submissions, and the worker stops claiming.
processing:
  enabled: ${PROCESSING_ENABLED:-true}

# Neon Auth (managed Better Auth). Tokens are verified locally against cached public keys.
auth:
  # For example https://ep-xxx.neonauth.ap-southeast-2.aws.neon.tech/neondb/auth. Neon sets the
  # token's issuer and audience to this URL's origin.
  base_url: ${NEON_AUTH_BASE_URL:-}
  verifier: neon_auth
  algorithms: [EdDSA]
  # Allowed clock difference between Neon and this server.
  leeway_seconds: 30
  jwks_timeout_seconds: 5
  # Keys are refreshed after this long, or sooner when a token names an unknown key.
  jwks_cache_seconds: 3600
  # An unknown key triggers at most one refetch per interval, so forged tokens can't flood Neon.
  jwks_min_refetch_seconds: 30
  # A profile's status is rechecked in the database after this long. Bans arrive in the token.
  profile_cache_seconds: 60
  profile_cache_max_entries: 1000

# Who may use the app.
access:
  # Off until the owner opens sign-ups (M7 at the earliest). While off, only allowlisted
  # emails can use the app, and everyone else sees a waitlist message.
  signups_enabled: ${SIGNUPS_ENABLED:-false}
  # Comma-separated, compared case-insensitively. Allowlisted emails ignore the user cap.
  allowlisted_emails: ${ACCESS_ALLOWLIST:-owner@example.com}
  # New sign-ups beyond this many active users are waitlisted.
  max_total_users: 25

# Per-user POC limits. user_limits.overrides replaces any of these for one user, and an
# override of null means unlimited.
limits:
  submissions_lifetime: 2
  submissions_per_24_hours: 1
  files_per_submission: 5
  max_file_bytes: 10485760
  max_submission_bytes: 26214400
  max_pdf_pages: 10
  max_images_per_submission: 25
  max_products_per_submission: 5

catalog:
  # A batch and everything in it is purged this long after it was created.
  retention_days: 30
  max_name_length: 200
  # Bounds list responses, so one request can't read an unbounded number of rows.
  max_list_items: 500

# Everything this project stores lives in one bucket, under one prefix per environment:
# prod/ (Render and EC2), dev/ (local development) and test/ (the live storage check).
storage:
  # s3, or memory for tests.
  backend: ${STORAGE_BACKEND:-s3}
  bucket: ${S3_BUCKET:-ai-catalog-intelligence}
  prefix: ${S3_PREFIX:-dev}
  region: ${AWS_REGION:-ap-southeast-2}
  connect_timeout_seconds: 5
  read_timeout_seconds: 30

uploads:
  # How long a browser has to finish an upload. Long enough for 10 MB on a slow connection.
  upload_url_seconds: 600
  max_original_name_length: 255
  # Supported extensions. The content type is fixed by the upload link, whatever the browser
  # claims, and the worker checks the file's contents match.
  types:
    csv: { kind: spreadsheet, content_type: text/csv }
    xlsx: { kind: spreadsheet, content_type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet }
    pdf: { kind: pdf, content_type: application/pdf }
    jpg: { kind: image, content_type: image/jpeg }
    jpeg: { kind: image, content_type: image/jpeg }
    png: { kind: image, content_type: image/png }
    webp: { kind: image, content_type: image/webp }
    zip: { kind: zip, content_type: application/zip }

# Checks the worker applies to each file. Per-user limits (pages, images) are under limits.
ingest:
  zip_max_entries: 200
  zip_max_total_bytes: 104857600
  zip_max_entry_bytes: 10485760
  # Uncompressed size divided by compressed size, per entry. Real files rarely pass 20.
  zip_max_ratio: 100
  # The ratio applies only to entries at least this big, since tiny repetitive files compress
  # far better than 100:1 and are harmless.
  zip_ratio_min_bytes: 1048576
  # Pillow refuses images with more pixels than this (image bombs).
  max_image_pixels: 50000000
  # How much of a CSV is read to check it's text.
  csv_sniff_bytes: 65536
  # Images inside a PDF are kept as files of their own, like ZIP entries. Smaller ones are
  # icons and decoration, and are left out uncounted. Repeats, such as a logo on every page,
  # are kept once.
  pdf_image_min_side: 150
  pdf_max_images_per_file: 50

# Reading spreadsheets into products (M3).
extraction:
  # Stored on every observation, so a later change to how cells are read is traceable.
  extractor: spreadsheet@1
  # The header row is looked for in this many rows from the top.
  header_scan_rows: 20
  # Data rows shown to the LLM along with the headers.
  sample_rows: 5
  # Cells longer than this are shortened in what the LLM sees. Stored values are never shortened.
  sample_cell_chars: 80
  # One extract job reads this many rows of a sheet.
  chunk_rows: 1000
  # Rows, columns and sheets beyond these are counted and reported, not read.
  max_rows_per_sheet: 50000
  max_columns: 200
  max_sheets_per_file: 20
  # A row whose cells add up to more than this is reported and skipped.
  max_row_bytes: 65536
  max_merged_ranges: 5000
  # Row problems reported per extract job. More than this are counted only.
  max_row_notes_per_chunk: 20
  # LLM column-mapping calls allowed in one run. Sheets past this use known names only.
  max_llm_calls_per_run: 10
  # An LLM mapping below this confidence is shown as a suggestion, and the column stays unmapped.
  min_llm_confidence: 0.6
  # Raise to stop reusing saved mappings, after changing the rules or the prompt.
  mapping_version: 1
  # A row's product is identified by the first of these attributes that has a value.
  identifier_attributes: [sku, model_number, gtin]
  # Known column names per attribute, compared after lowercasing and removing punctuation.
  # Anything not listed here is put to the LLM. Codes must exist in attribute_definitions.
  header_names:
    sku: [sku, sku code, sku no, sku number, item no, item number, item code, item id,
          article no, article number, article code, art no, art nr, artikelnummer,
          product code, product id, product no, product number, part no, part number,
          ref, reference, ref no, stock code]
    model_number: [model, model no, model number, model name, model code, mpn,
                   manufacturer part number, mfr part no]
    gtin: [gtin, ean, ean13, ean 13, ean code, upc, upc code, barcode, bar code, gtin 13, gtin 14]
    product_name: [name, product name, product title, title, item name, item description,
                   product, article name]
    brand: [brand, brand name, make, manufacturer]
    description: [description, product description, long description, details, desc]
    color: [color, colour, color name, colour name]
    material: [material, materials, material composition]
    price: [price, unit price, cost, cost price, wholesale price, list price, net price, rate,
            fob price, mrp, rrp]
    currency: [currency, currency code, cur]
    pack_quantity: [pack qty, pack quantity, pack size, pcs per carton, pieces per carton,
                    qty per carton, units per carton, carton qty, inner qty, moq]
    net_weight: [net weight, net wt, nett weight, weight, product weight, item weight, nw]
    capacity: [capacity, volume]
    length: [length, product length, item length]
    width: [width, product width, item width]
    height: [height, product height, item height]
    supplier_category: [category, product category, category name, product type, type, range,
                        collection, department]

# Reading PDFs and photos into products (M4).
documents:
  # Stored on every observation, so a later change to how text is read is traceable.
  extractor_text: pdf_text+llm@1
  extractor_ocr: ocr+llm@1
  # A PDF page with fewer characters than this is treated as scanned and read with OCR.
  min_page_chars: 40
  # Resolution scanned pages are rendered at for OCR.
  render_dpi: 200
  # OCR engine, from the registry in app/ocr. Lines below this confidence are dropped.
  ocr_engine: rapidocr
  ocr_min_confidence: 0.5
  # Characters of a page or photo sent to the LLM. Longer text is cut, and the cut reported.
  max_llm_chars: 12000
  # LLM calls allowed in one run for reading values. Pages past this are reported, not read.
  max_llm_calls_per_run: 80
  # Value problems reported per batch. More than this are counted only.
  max_notes_per_run: 40
  # Product keys shorter than this must match a whole word, so "12" can't match "1200 ml".
  min_key_chars_for_loose_match: 4

# Image records, thumbnails, near-duplicate groups and embeddings (M5A).
images:
  # One processing job handles this many images.
  chunk_size: 8
  # Thumbnails are JPEGs no larger than this on their longest side.
  thumbnail_side: 320
  thumbnail_quality: 82
  # Images are shrunk to at most this before embedding, which the model requires anyway.
  embed_max_side: 2048
  # Images smaller than this on either side get a record and a hash, but no embedding.
  embed_min_side: 32
  # Two images are near-duplicates when both of these agree. Embeddings alone call the same
  # box in another colour a copy, so colour must be close too. Tuned on the owner's box
  # photos: copies scored 0.92-1.0 similar and 0-0.014 apart in colour; a recoloured copy
  # 0.064 apart, and other sides of the same box at most 0.75 similar.
  duplicate_min_similarity: 0.90
  # Largest difference of the hue histograms (0 to 2).
  duplicate_max_colour_distance: 0.04
  # Signed thumbnail links last this long.
  thumbnail_url_seconds: 900

# Which product each image shows (M5B). A code found for the image is the only signal that can
# accept a match by itself, and only when no other product's code is found for the same image.
matching:
  # Points each signal adds to an image-product pair. The score is capped at 1.
  weights:
    code_in_text: 1.0
    code_in_name: 1.0
    from_product_page: 0.6
    same_picture: 0.5
    brand_or_name_in_text: 0.25
    looks_like_accepted: 0.4
    # Only in a batch with one product: enough for review, never for acceptance.
    only_product: 0.2
  # Looks-alike only counts from this similarity up, and scales to its full weight at 1.0.
  visual_min_similarity: 0.70
  # Brand and name words shorter than this are ignored, so "Set" or "Mug" alone can't match.
  min_text_match_chars: 4
  # Pairs scoring below this aren't stored. Above it, they go to review unless auto-accepted.
  review_threshold: 0.2
  # Candidates kept per image, best first.
  max_candidates_per_image: 3

# Standard values and the value each product shows (M6). Defaults are for India; making them a
# choice per user comes later.
normalization:
  # Stored on every normalized value. Raise it when a rule changes; old rows stay.
  rule_version: units@1
  # Commas group digits, including lakh grouping (1,00,000), and a dot is the decimal point.
  # A comma followed by one or two digits and nothing else ("1,5") is read as a decimal comma.
  # A price with no currency is taken as this, marked as assumed.
  default_currency: INR
  # A lone "$" is taken as this, marked as assumed.
  dollar_currency: USD
  # Numbers within this share of each other agree (1 kg and 2.2 lb do; 1.5 L and 1.4 L don't).
  agreement_tolerance: 0.01
  # When sources agree, the value shown comes from the lowest rank. Unlisted extractors rank last.
  source_ranks:
    spreadsheet@1: 1
    pdf_text+llm@1: 2
    ocr+llm@1: 3
  standard_units: { mass: g, volume: ml, length: mm }
  # Each unit as written, lowercased, to the standard unit of its family.
  units:
    mass: { mg: 0.001, g: 1, gm: 1, gms: 1, gr: 1, gram: 1, grams: 1, gramme: 1, grammes: 1,
            kg: 1000, kgs: 1000, kilo: 1000, kilos: 1000, kilogram: 1000, kilograms: 1000,
            lb: 453.59237, lbs: 453.59237, pound: 453.59237, pounds: 453.59237,
            oz: 28.349523125, ounce: 28.349523125, ounces: 28.349523125 }
    volume: { ml: 1, millilitre: 1, millilitres: 1, milliliter: 1, milliliters: 1, cc: 1,
              cl: 10, dl: 100, l: 1000, lt: 1000, ltr: 1000, ltrs: 1000, litre: 1000,
              litres: 1000, liter: 1000, liters: 1000, fl oz: 29.5735295625,
              floz: 29.5735295625, fl. oz: 29.5735295625, gallon: 3785.411784,
              gallons: 3785.411784 }
    length: { mm: 1, millimetre: 1, millimetres: 1, millimeter: 1, millimeters: 1, cm: 10,
              centimetre: 10, centimetres: 10, centimeter: 10, centimeters: 10, m: 1000,
              metre: 1000, metres: 1000, meter: 1000, meters: 1000, in: 25.4, inch: 25.4,
              inches: 25.4, '"': 25.4, ft: 304.8, feet: 304.8, foot: 304.8 }
  # Currency as written, lowercased, to its ISO code. "$" is handled by dollar_currency.
  currencies: { "₹": INR, rs: INR, rs.: INR, inr: INR, rupee: INR, rupees: INR, usd: USD,
                us$: USD, "€": EUR, eur: EUR, "£": GBP, gbp: GBP, aud: AUD, a$: AUD }
  # Words that make a value approximate or a limit, not a measurement.
  approximate_words: [ca, ca., approx, approx., approximately, about, around, "~", upto,
                      up to, max, max., maximum, min, min., minimum, "<", ">", "≤", "≥"]
  category:
    # Off: no category is chosen and none is asked for (tests turn it off unless they need it).
    enabled: true
    # Below this, or "other", the category goes to review.
    min_confidence: 0.7
  variants:
    # Removed from names before comparing, so "Mug Red" and "Mug Blue" match.
    colour_words: [black, white, red, blue, green, yellow, orange, pink, purple, grey, gray,
                   silver, gold, brown, beige, cream, clear, transparent, natural, navy, teal]
    size_words: [small, medium, large, xl, xxl, mini, big, s, m, l]
    # Codes sharing everything but a final part of at most this many characters are variants.
    code_suffix_max_chars: 4
    # Photos at least this similar support a name or code match; never enough alone.
    image_support_min_similarity: 0.85

# Titles, descriptions and bullets written from settled attributes only (D37). Every claim cites
# the facts it uses, and code checks it before anything is stored.
enrichment:
  # The grounding rules' version, stored with each generated text.
  rules_version: enrich@1
  # Write copy at the end of processing and after confirmed photos are read (owner, 2026-11-15).
  # Off: copy is written only when someone presses Generate. Tests turn it off.
  auto: true
  # Only these attribute states feed text.
  usable_states: [verified, reviewer_set]
  # Never given to the model.
  excluded_attributes: [price, currency, sku, gtin, supplier_category]
  # Given to the model, but allowed in the title only.
  title_only_attributes: [model_number]
  max_versions_per_product: 10
  title_max_chars: 150
  bullets_min: 3
  bullets_max: 5
  bullet_max_chars: 200
  sentences_min: 2
  sentences_max: 5
  description_max_chars: 1000
  # A fact's text is cut to this before it goes in the prompt (a long supplier description).
  fact_max_chars: 1500
  # Specification phrases a claim may use only if a cited fact says them too.
  claim_phrases: [dishwasher safe, dishwasher-safe, microwave safe, microwave-safe, oven safe,
                  oven-safe, freezer safe, freezer-safe, bpa free, bpa-free, leak proof,
                  leak-proof, leakproof, spill proof, spill-proof, food grade, food-grade,
                  non-stick, nonstick, non stick, rust proof, rust-proof, rustproof,
                  stain resistant, stain-resistant, waterproof, water resistant,
                  water-resistant, shatterproof, shatter-proof, unbreakable, insulated,
                  vacuum, double wall, double-wall, heat resistant, heat-resistant,
                  induction, warranty, guarantee, certified, certification, iso, fda, bis,
                  isi, lfgb, organic, eco-friendly, eco friendly, biodegradable,
                  recyclable, compostable, handmade, hand made, handcrafted, imported,
                  made in, toxin free, toxin-free, lead free, lead-free, antibacterial,
                  anti-bacterial, odour free, odor free, ergonomic]
  # Material words a claim may use only if a cited fact says them too. Colour words come from
  # normalization.variants.colour_words.
  material_words: [steel, stainless, aluminium, aluminum, copper, brass, iron, cast iron,
                   glass, borosilicate, ceramic, porcelain, stoneware, earthenware, bone china,
                   melamine, plastic, polypropylene, silicone, rubber, wood, wooden, bamboo,
                   acacia, teak, marble, granite, stone, cotton, linen, jute, polyester,
                   nylon, acrylic, tritan, titanium, enamel, enamelled, cork, leather]
  # Never allowed: claims no source can support.
  banned_phrases: ["best", "#1", "number one", "guaranteed", "100%", "perfect", "world's",
                   "finest", "cheapest", "lowest price", "free shipping", "sale", "discount",
                   "cure", "cures", "heal", "heals", "healthy", "healthier", "detox",
                   "doctor recommended", "clinically"]

# Catalog checks (D38): deterministic rules, run whenever a batch or product is read. Errors
# block approval (M9) and can't be set aside; warnings can, with a reason; info never blocks.
validation:
  rules_version: checks@1
  default_profile: shopify
  # Default severity per rule. A profile can override any of them.
  severities:
    required_attribute: error
    attribute_conflict: warning
    attribute_unclear: info
    category: error
    identifier: error
    price_positive: error
    currency_assumed: warning
    measurements: warning
    generated_text: warning
    title_length: error
    bullets: warning
    photo: warning
    open_review: warning
    duplicate_gtin: error
    duplicate_model_number: warning
    duplicate_name: warning
    duplicate_photo: warning
  # Above these, a settled measurement is probably a unit mistake (standard units: g, ml, mm).
  ceilings: { mass: 1000000, volume: 1000000, length: 5000 }
  # Marketplace numbers are from memory and UNVERIFIED against current Shopify and Amazon
  # documentation (D38, decision 8). Check them before relying on a profile.
  profiles:
    generic:
      name: Generic catalog
      required: [product_name, brand]
      title_max_chars: 200
      bullets_min: 0
      severities: {}
    shopify:
      name: Shopify
      required: [product_name, price]
      title_max_chars: 255
      bullets_min: 0
      severities: { photo: warning }
    amazon_in:
      name: Amazon India
      required: [product_name, brand, gtin, price]
      title_max_chars: 200
      bullets_min: 3
      severities: { photo: error }

# Image embeddings come from Bedrock, from the worker only (D34). Changing the model means a new
# embedding_models row, and a new table if the dimension changes.
embeddings:
  # bedrock, or fake for tests.
  backend: ${EMBEDDINGS_BACKEND:-bedrock}
  provider: bedrock
  model_id: amazon.titan-embed-image-v1
  model_version: "1"
  dimension: 1024
  region: ${AWS_REGION:-ap-southeast-2}
  timeout_seconds: 30
  # USD per image, Sydney on-demand price, recorded with every call for the spend cap.
  price_per_image: 0.00008

# LLM calls go through LangChain to Amazon Bedrock (D24), from the worker only.
llm:
  # bedrock, or fake for tests.
  backend: ${LLM_BACKEND:-bedrock}
  region: ${AWS_REGION:-ap-southeast-2}
  connect_timeout_seconds: 5
  # Every user's calls together. Once this month's recorded cost reaches it, LLM steps are
  # skipped and say so, and the rest of processing carries on.
  monthly_spend_cap_usd: 10
  # One entry per task, so moving a task to another model is a change here only.
  tasks:
    column_mapping:
      model_id: openai.gpt-oss-120b-1:0
      prompt: extraction/column_mapping
      prompt_version: "1"
      max_tokens: 4000
      temperature: 0
      timeout_seconds: 60
      # Calls made for one request, counting retries after an unusable reply.
      max_attempts: 2
    category:
      model_id: openai.gpt-oss-120b-1:0
      prompt: catalog/category
      prompt_version: "1"
      max_tokens: 2000
      temperature: 0
      timeout_seconds: 60
      max_attempts: 2
    document_attributes:
      model_id: openai.gpt-oss-120b-1:0
      prompt: extraction/document_attributes
      prompt_version: "1"
      max_tokens: 6000
      temperature: 0
      timeout_seconds: 90
      max_attempts: 2
    enrichment:
      model_id: openai.gpt-oss-120b-1:0
      prompt: catalog/enrichment
      prompt_version: "1"
      # Room for gpt-oss's reasoning as well as the text.
      max_tokens: 4000
      temperature: 0
      timeout_seconds: 90
      max_attempts: 2
  # USD per million tokens, used to record what each call cost.
  prices:
    openai.gpt-oss-120b-1:0: { input: 0.155, output: 0.618 }

compute:
  # ec2 starts the instance. noop assumes you started worker.py yourself.
  worker_controller: ${WORKER_CONTROLLER:-noop}
  instance_id: ${WORKER_INSTANCE_ID:-}
  region: ${AWS_REGION:-ap-southeast-2}
  # A heartbeat newer than this means a worker is alive, so AWS isn't called.
  heartbeat_fresh_seconds: 90
  start_cooldown_seconds: 60
  start_retry_seconds: 65
  start_retry_max_attempts: 20
  # New work waits once this many EC2 hours are used in a calendar month.
  max_ec2_hours_per_month: 30

queue:
  lease_seconds: 120
  max_attempts: 3
  backoff_base_seconds: 10
  # Must stay below worker.idle_timeout_seconds, so a retry can't strand itself.
  backoff_max_seconds: 120

# The worker runs on EC2, and is deployed automatically after each merge to main.
worker:
  power_controller: ${WORKER_POWER_CONTROLLER:-noop}
  code_sha: ${WORKER_CODE_SHA:-unknown}
  ec2_instance_id: ${WORKER_INSTANCE_ID:-}
  heartbeat_file: ${WORKER_HEARTBEAT_FILE:-}
  power_request_file: ${WORKER_POWER_REQUEST_FILE:-/run/catalog-worker/poweroff}
  heartbeat_seconds: 30
  poll_busy_seconds: 5
  poll_idle_seconds: 15
  busy_window_seconds: 60
  idle_timeout_seconds: 300
  stop_grace_seconds: 60
  reaper_interval_seconds: 60
  # A job running longer than this is treated as stuck, and the process exits.
  max_job_seconds: 1800
  # A local worker refuses to start against this database endpoint. Not a secret.
  production_db_endpoint: <PROD_DB_ENDPOINT>

pipelines:
  noop:
    - stage: noop
      job_type: noop_plan
  # A batch's files are checked one job per file, then the image limit is applied across them.
  # Then spreadsheets are mapped and their products chosen, and rows are read in chunks.
  ingest:
    - stage: ingest
      job_type: ingest_plan
    - stage: finalize
      job_type: ingest_finalize
    - stage: extract
      job_type: extract_select
    # PDFs and photos: text is read one file per job, then values are read in file order.
    - stage: documents
      job_type: documents_plan
    - stage: document_values
      job_type: document_values
    # Images: records and thumbnails in chunks, then near-duplicate groups across the batch.
    - stage: images
      job_type: images_plan
    - stage: image_groups
      job_type: images_group
    # Which product each image shows, then values from photos accepted for a product.
    - stage: associate
      job_type: associate_images
    # Standard values, the value each product shows, variants, then categories.
    - stage: normalize
      job_type: normalize_batch
    # Titles, descriptions and bullets from settled values (D37), when enrichment.auto is on.
    - stage: enrich
      job_type: enrich_plan
  # Values from photos a person accepted for a product, after processing finished.
  photo_values:
    - stage: photo_values
      job_type: photo_values_plan
    - stage: normalize
      job_type: normalize_batch
    - stage: enrich
      job_type: enrich_plan

  # Titles, descriptions and bullets, started from the batch page (D37). One chunk per product.
  enrich:
    - stage: enrich
      job_type: enrich_plan

# Admin-only diagnostic runs of the no-op pipeline.
test_runs:
  max_chunks: 20
  max_sleep_seconds: 900
