[project]
name = "ai-catalog-intelligence-backend"
version = "0.1.0"
description = "API and processing worker for AI Catalog Intelligence"
requires-python = ">=3.12,<3.13"
# Shared by the API and worker. Keep this light: the API runs in 512 MB.
dependencies = [
    # Loaded lazily by both: the API presigns uploads, and the worker reads and writes files.
    "boto3>=1.43,<2",
    "psycopg[binary,pool]>=3.3,<4",
    "pydantic>=2.14,<3",
    "python-dotenv>=1.2,<2",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.162,<1",
    "pyjwt[crypto]>=2.10,<3",
    "uvicorn>=0.54,<1",
]
# Heavy processing packages (torch, OpenCV, OCR) belong here, never in `api`.
worker = [
    "defusedxml>=0.7,<1",
    "jinja2>=3.1,<4",
    "langchain-aws>=1.9,<2",
    "openpyxl>=3.1,<4",
    "pillow>=13.0,<14",
    "pypdf>=7.0,<8",
]
migrate = [
    "alembic>=1.20,<2",
    "sqlalchemy>=2.1,<3",
]

[dependency-groups]
dev = [
    "httpx2>=0.1",
    "mypy>=2.4,<3",
    "pytest>=9.2,<10",
    "ruff>=0.17,<1",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "G", "S", "T20"]
# The house style logs failures with logger.error(..., exc_info=True).
ignore = ["G201"]

[tool.ruff.lint.isort]
# Tests import shared helpers from conftest, which pytest puts on the path.
known-first-party = ["app", "conftest", "pipeline", "samples"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "server.py", "worker.py"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "defusedxml.*", "openpyxl.*"]
ignore_missing_imports = true
