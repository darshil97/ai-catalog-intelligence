name: CI

# Also runs on main, because Render's "After CI Checks Pass" won't deploy a commit with no checks.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.12 --extra api --extra migrate --extra worker
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest

  # The jobs below run only on main. Render waits for all of them before deploying the API, so
  # the order is always migrate, then worker, then API.
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      worker: ${{ steps.paths.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          backend=false
          worker=false
          if grep -q '^backend/' <<<"$files"; then backend=true; fi
          # API-only (app/api, app/auth, server.py) and test changes don't need a worker deploy.
          if grep '^backend/' <<<"$files" | grep -qvE '^backend/(app/api/|app/auth/|server\.py|tests/)'; then worker=true; fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo "backend=$backend worker=$worker"

  migrate:
    needs: [backend, changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency: production-deploy
    defaults:
      run:
        working-directory: backend
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.12 --no-dev --extra api --extra migrate
      - run: uv run --no-sync python infra/ci/production.py migrate

  deploy-worker:
    needs: [migrate, changes]
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    # Allows 20 minutes for a running job to finish, plus the deploy itself.
    timeout-minutes: 45
    environment: production
    concurrency: production-deploy
    defaults:
      run:
        working-directory: backend
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      WORKER_INSTANCE_ID: ${{ vars.WORKER_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.12 --no-dev --extra api
      - run: uv run --no-sync python infra/ci/production.py deploy-worker --sha "$GITHUB_SHA"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Build
        run: npm run build
